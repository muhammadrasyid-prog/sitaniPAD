name: Deploy to Infinity Free

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, pdo, pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build assets
        run: npm run build

      - name: Create .env.production for deployment
        run: |
          cat > .env.production << 'EOF'
          APP_NAME=SITANI
          APP_ENV=production
          APP_KEY=base64:uWczknmw9RXOivLiQzOHqZe8g36NrwZBVHl89gJKvmI=
          APP_DEBUG=false
          APP_URL=https://sitani.infinityfree.io
          
          APP_LOCALE=id
          APP_FALLBACK_LOCALE=id
          APP_FAKER_LOCALE=id_ID
          
          APP_MAINTENANCE_DRIVER=file
          
          BCRYPT_ROUNDS=12
          
          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=error
          
          DB_CONNECTION=mysql
          DB_HOST=sql204.infinityfree.com
          DB_PORT=3306
          DB_DATABASE=if0_42934098_sitani
          DB_USERNAME=if0_42934098
          DB_PASSWORD=DbU0hrVjVHN9vr
          
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null
          
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database
          
          CACHE_STORE=database
          
          MAIL_MAILER=log
          MAIL_SCHEME=null
          MAIL_HOST=127.0.0.1
          MAIL_PORT=2525
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_FROM_ADDRESS="hello@example.com"
          MAIL_FROM_NAME="${APP_NAME}"
          
          VITE_APP_NAME="${APP_NAME}"
          EOF

      - name: Create deployment directory
        run: |
          mkdir -p deploy
          cp -r app bootstrap config database lang public resources routes storage tests vendor .env.production deploy/
          cp artisan deploy/
          cp composer.json deploy/
          cp package.json deploy/

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./deploy/
          server-dir: ./public_html/
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
